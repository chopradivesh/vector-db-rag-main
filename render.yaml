# Render deployment config ("Blueprint"). Render reads this file automatically.
services:
  - type: web
    name: vector-db-rag
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
